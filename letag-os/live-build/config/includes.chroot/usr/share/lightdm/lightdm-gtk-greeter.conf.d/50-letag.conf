# Letag OS — apparence de l'écran de connexion (sans animation).
[greeter]
background=/usr/share/letag/fonds/letag-connexion.png
user-background=false
theme-name=Letag-Sombre
icon-theme-name=Letag-Sombre
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
default-user-image=/usr/share/letag/logo/avatar.png
round-user-image=true
clock-format=%A %e %B  %H:%M
indicators=~host;~spacer;~clock;~spacer;~layout;~session;~a11y;~power
position=50%,center 50%,center
panel-position=bottom
transition-duration=0
screensaver-timeout=60
