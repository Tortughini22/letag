# Letag OS — lecture vidéo sur i5-650 + Quadro FX 380 (nouveau).
# Pas de décodage matériel disponible : décodage logiciel multi-thread.
hwdec=no
# Profil « fast » : mise à l'échelle simple, peu coûteuse pour un GPU ancien.
profile=fast
# En mode d'affichage de secours, mpv bascule seul sur une sortie compatible.
vo=gpu,xv,x11
