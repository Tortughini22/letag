# Letag OS — swap compressé en RAM (zram).
# 4 Go de RAM : un périphérique zram de 75 % de la RAM (≈ 3 Go non compressés).
# Avec zstd, le taux de compression typique est de 2,5 à 4 : ces 3 Go occupent
# environ 0,8 à 1,2 Go de RAM réelle quand ils sont pleins. Cela évite d'écrire
# sur le disque dur mécanique, dont la lenteur (≈ 10 ms par accès) provoque les
# blocages.
[zram0]
zram-size = ram * 0.75
compression-algorithm = zstd
swap-priority = 100
