# Letag OS — réglages GRUB (lus après /etc/default/grub).
GRUB_DISTRIBUTOR="Letag OS"
# Menu toujours visible 3 s : permet de choisir « dépannage » si l'affichage échoue.
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_GFXMODE=1024x768,800x600,auto
GRUB_BACKGROUND="/usr/share/letag/grub/fond.png"
# Détecter les autres systèmes déjà installés (Windows, autre Linux) pour
# qu'ils restent démarrables après l'installation.
GRUB_DISABLE_OS_PROBER=false
# Le mode graphique choisi avec « letag-graphique » est écrit dans
# /etc/default/grub.d/60-letag-graphique.cfg.
