# Letag OS — séquence de l'installateur Calamares (base : calamares-settings-debian).
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       letag-amorce
  module:   shellprocess
  config:   shellprocess-letag-amorce.conf
- id:       letag-sources
  module:   shellprocess
  config:   shellprocess-letag-sources.conf
- id:       letag-final
  module:   shellprocess
  config:   shellprocess-letag-final.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - dpkg-unsafe-io
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@letag-amorce
  - grubcfg
  - bootloader
  - packages
  - shellprocess@letag-final
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - shellprocess@letag-sources
  - umount
- show:
  - finished

branding: letag
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
