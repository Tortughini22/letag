# Letag OS — paquets propres à la session live, retirés du système installé.
---
backend: apt
skip_if_no_internet: false
update_db: false
update_system: false
operations:
  - try_remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - live-boot-initramfs-tools
      - calamares
      - calamares-settings-debian
      - gparted
      - user-setup
      - squashfs-tools
      - qml6-module-qtquick
      - qml6-module-qtquick-window
