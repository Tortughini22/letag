source /boot/grub/config.cfg

# Live boot
@LINUX_LIVE@

# Néo OS — variantes d'affichage (UEFI ; le HP Z200 démarre en BIOS via isolinux)
menuentry "Néo OS - affichage sans acceleration (nouveau.noaccel)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nouveau.noaccel=1
	initrd	@INITRD_LIVE@
}
menuentry "Néo OS - affichage de secours (nomodeset)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}
menuentry "Néo OS - copie en memoire vive (toram)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Outils...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
