# Néo OS — écran de connexion : fond sombre de la palette, carte crème
# (thème Neo-Clair, styles #login_window dans le thème), sans animation.
[greeter]
background=/usr/share/neo/fonds/neo-connexion.png
user-background=false
theme-name=Neo-Clair
icon-theme-name=Neo
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
default-user-image=/usr/share/neo/logo/avatar.png
round-user-image=true
clock-format=%A %e %B  %H:%M
indicators=~host;~spacer;~clock;~spacer;~layout;~session;~a11y;~power
position=50%,center 50%,center
panel-position=bottom
transition-duration=0
screensaver-timeout=60
