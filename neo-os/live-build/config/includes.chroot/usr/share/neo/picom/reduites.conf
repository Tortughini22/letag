# Néo OS — animations réduites : simples fondus de 70 à 100 ms, sans
# déplacement ni mise à l'échelle (moins de calcul, confort visuel).
@include "/usr/share/neo/picom/commun.conf"

animations = (
  { triggers = [ "open", "show" ]; preset = "appear"; scale = 1.0; duration = 0.10; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 1.0; duration = 0.08; }
);

rules = (
  { match = "window_type = 'dock' || window_type = 'desktop'"; shadow = false; corner-radius = 0; animations = (); },
  { match = "window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'menu' || window_type = 'combo' || window_type = 'tooltip'"; corner-radius = 6;
    animations = ( { triggers = [ "open", "show" ]; preset = "appear"; scale = 1.0; duration = 0.07; },
                   { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 1.0; duration = 0.05; } ); },
  { match = "window_type = 'notification' || class_g = 'Xfce4-notifyd'"; corner-radius = 12; },
  { match = "fullscreen"; corner-radius = 0; shadow = false; }
);
