# Néo OS — animations complètes : courtes (90 à 200 ms) et légères.
@include "/usr/share/neo/picom/commun.conf"

animations = (
  # Ouverture : la fenêtre grandit légèrement en apparaissant (160 ms)
  { triggers = [ "open" ]; preset = "appear"; scale = 0.94; duration = 0.16; },
  # Fermeture : inverse, plus rapide (120 ms)
  { triggers = [ "close" ]; preset = "disappear"; scale = 0.94; duration = 0.12; },
  # Réduction : la fenêtre rétrécit et descend vers la barre des tâches (190 ms)
  {
    triggers = [ "hide" ];
    var-t = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.19; start = 0; end = 1; };
    opacity = "1 - var-t";
    shadow-opacity = "opacity";
    scale-x = "1 - var-t * 0.65";
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) * window-height + var-t * (window-monitor-height - window-y - window-height)";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  # Restauration : chemin inverse (190 ms)
  {
    triggers = [ "show" ];
    var-t = { curve = "cubic-bezier(0, 0, 0.2, 1)"; duration = 0.19; start = 1; end = 0; };
    opacity = "1 - var-t";
    shadow-opacity = "opacity";
    scale-x = "1 - var-t * 0.65";
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) * window-height + var-t * (window-monitor-height - window-y - window-height)";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
);

rules = (
  # Barre des tâches et bureau : ni ombre, ni coins, ni animation
  { match = "window_type = 'dock' || window_type = 'desktop'"; shadow = false; corner-radius = 0; animations = (); },
  # Menus (dont le menu des applications) : apparition rapide (90 ms)
  {
    match = "window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'menu' || window_type = 'combo' || class_g = 'Wrapper-2.0'";
    corner-radius = 6;
    animations = (
      { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.97; duration = 0.09; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.98; duration = 0.07; }
    );
  },
  # Infobulles : fondu très court, sans ombre
  { match = "window_type = 'tooltip'"; shadow = false; corner-radius = 6;
    animations = ( { triggers = [ "open", "show" ]; preset = "appear"; scale = 1.0; duration = 0.08; },
                   { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 1.0; duration = 0.06; } ); },
  # Notifications : glissent depuis la droite (180 ms)
  { match = "window_type = 'notification' || class_g = 'Xfce4-notifyd'"; corner-radius = 12;
    animations = ( { triggers = [ "open", "show" ]; preset = "slide-in"; direction = "right"; duration = 0.18; },
                   { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.96; duration = 0.14; } ); },
  # Plein écran (vidéo) : pas de coins arrondis
  { match = "fullscreen"; corner-radius = 0; shadow = false; }
);
