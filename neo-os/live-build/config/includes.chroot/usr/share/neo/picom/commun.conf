# Néo OS — réglages picom communs (inclus par completes.conf et reduites.conf).
# Rendu XRender : pas d'OpenGL, donc pas de dépendance aux pilotes 3D (nouveau
# sur Quadro FX 380, VESA en secours) ; le processeur fait le travail.
backend = "xrender";
vsync = true;
use-damage = true;
unredir-if-possible = true;   # vidéo et jeux en plein écran : composition suspendue
detect-client-opacity = true;
detect-transient = true;

# Relief discret : ombre douce teintée bleu marine, coins arrondis.
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.20;
shadow-offset-x = -12;
shadow-offset-y = -9;
shadow-color = "#0F2B5B";
corner-radius = 8;
