# Néo OS — partitionnement. AUCUNE option présélectionnée : l'utilisateur
# doit choisir lui-même (installer à côté, remplacer, manuel ou effacer).
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"
# Pas de swap sur le disque dur par défaut : zram (en RAM compressée) est
# configuré d'office. Un fichier d'échange reste proposé.
userSwapChoices:
    - none
    - file
initialSwapChoice: none
initialPartitioningChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: true
# Chiffrement non proposé en installation guidée dans cette version : les
# outils nécessaires (cryptsetup-initramfs) ne sont pas sur le support live.
enableLuksAutomatedPartitioning: false
luksGeneration: luks1
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "xfs", "btrfs"]
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: true
