---
userGroup:       users
defaultGroups:
    - cdrom
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - users
    - adm
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
    nonempty: true
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "neo-${first}"
