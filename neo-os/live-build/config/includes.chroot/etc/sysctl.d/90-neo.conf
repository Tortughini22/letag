# Néo OS — réglages mémoire et disque pour 4 Go de RAM + disque dur mécanique.

# Le swap principal est zram (rapide) : on peut y envoyer des pages anonymes
# plus volontiers que de vider le cache de fichiers (relu sur le disque lent).
vm.swappiness = 150
# zram n'a pas de temps d'accès : inutile de lire les pages par grappes.
vm.page-cluster = 0
# Garder plus longtemps les métadonnées (inodes/dentries) : chaque relecture
# coûte un déplacement de tête du disque.
vm.vfs_cache_pressure = 50
# Écritures différées plus petites et plus régulières : évite les longs gels
# lors de copies de gros fichiers sur un disque à ~80 Mo/s.
vm.dirty_background_ratio = 3
vm.dirty_ratio = 10
# kswapd réagit un peu plus tôt (marge plus grande avant la pénurie).
vm.watermark_scale_factor = 125
vm.watermark_boost_factor = 0
