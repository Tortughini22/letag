# Néo OS — réglages GRUB (lus après /etc/default/grub).
GRUB_DISTRIBUTOR="Néo OS"
# Menu toujours visible 3 s : permet de choisir « dépannage » si l'affichage échoue.
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_GFXMODE=1024x768,800x600,auto
GRUB_BACKGROUND="/boot/grub/themes/neo/fond.png"
# Thème complet (menu menthe sur bleu marine, textes en français).
GRUB_THEME="/boot/grub/themes/neo/theme.txt"
# Détecter les autres systèmes déjà installés (Windows, autre Linux) pour
# qu'ils restent démarrables après l'installation.
GRUB_DISABLE_OS_PROBER=false
# Le mode graphique choisi avec « neo-graphique » est écrit dans
# /etc/default/grub.d/60-neo-graphique.cfg.
